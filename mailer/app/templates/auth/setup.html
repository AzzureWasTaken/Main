{% extends "base.html" %}
{% block title %}Welcome{% endblock %}
{% block auth %}
<div class="card">
  <h1>Welcome to Mailer</h1>
  <p class="sub">Create the first admin account. You can add your team afterwards.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Your name</label>
    <input type="text" id="name" name="name" required autofocus>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" minlength="10" required>
    <div class="hint">At least 10 characters.</div>
    <p><button class="btn primary" style="width: 100%;">Create admin account</button></p>
  </form>
</div>
{% endblock %}
